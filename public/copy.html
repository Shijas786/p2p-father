<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>Copy Code — P2PFather</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
    .card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:36px 28px;text-align:center;max-width:320px;width:90%;}
    .icon{font-size:52px;margin-bottom:16px;}
    h1{color:#fff;font-size:20px;font-weight:700;margin-bottom:8px;}
    .code{font-size:36px;font-weight:800;letter-spacing:10px;color:#10b981;margin:18px 0;font-family:monospace;}
    p{color:#94a3b8;font-size:14px;line-height:1.5;margin-bottom:24px;}
    .btn{display:block;width:100%;padding:14px;border-radius:12px;border:none;background:#10b981;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
    .ok{color:#10b981;font-size:13px;font-weight:600;margin-top:14px;}
    .err{color:#ef4444;font-size:13px;margin-top:14px;}
  </style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">🔑</div>
  <h1 id="title">Your Login Code</h1>
  <div class="code" id="code-display">------</div>
  <p id="desc">Tap below to copy your code, then paste it on the P2PFather web dashboard.</p>
  <button class="btn" id="copy-btn" onclick="copyCode()">📋 Copy Code</button>
  <div id="status"></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const code = (params.get('c') || '').replace(/\D/g, '').slice(0, 6);

  if (!code || code.length !== 6) {
    document.getElementById('title').textContent = 'Invalid Link';
    document.getElementById('desc').textContent = 'This link is invalid or expired. Please request a new login code.';
    document.getElementById('copy-btn').style.display = 'none';
    document.getElementById('icon').textContent = '❌';
    document.getElementById('code-display').textContent = '';
  } else {
    document.getElementById('code-display').textContent = code;
    // Auto-copy on load
    window.addEventListener('load', () => doCopy(false));
  }

  async function copyCode() { await doCopy(true); }

  async function doCopy(showMsg) {
    if (!code) return;
    const status = document.getElementById('status');
    const btn = document.getElementById('copy-btn');
    try {
      await navigator.clipboard.writeText(code);
      document.getElementById('icon').textContent = '✅';
      btn.textContent = '✅ Copied!';
      btn.style.background = '#059669';
      if (showMsg) {
        status.className = 'ok';
        status.textContent = 'Code copied! Go paste it on the web dashboard.';
      }
    } catch {
      if (showMsg) {
        status.className = 'err';
        status.textContent = 'Long-press the code above to copy manually.';
      }
    }
  }
</script>
</body>
</html>
