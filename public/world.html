<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2PFather &middot; World ID Verification</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0B0E14;
            --bg-card: #141A24;
            --orange-primary: #FE7446;
            --orange-glow: rgba(254, 116, 70, 0.25);
            --world-cyan: #4E65FF;
            --text-main: #FFFFFF;
            --text-muted: #8E9BAE;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-orange: rgba(254, 116, 70, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(254, 116, 70, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 85%, rgba(78, 101, 255, 0.1) 0%, transparent 50%);
            background-repeat: no-repeat;
        }

        .verify-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #18202D 0%, #121822 100%);
            border: 1px solid var(--border-orange);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 30px var(--orange-glow);
            position: relative;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, #FE7446 0%, #FF4D15 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px var(--orange-glow);
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .action-button {
            width: 100%;
            padding: 15px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FE7446 0%, #FF5A26 100%);
            color: #FFFFFF;
            box-shadow: 0 6px 20px var(--orange-glow);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.4;
            margin-top: 18px;
            text-align: left;
        }

        .status-box.info {
            background: rgba(78, 101, 255, 0.12);
            border: 1px solid rgba(78, 101, 255, 0.3);
            color: #A3B3FF;
        }

        .status-box.success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34D399;
        }

        .status-box.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
        }

        .app-id-bar {
            margin-top: 18px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            font-size: 11px;
            text-align: left;
        }

        .app-id-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .app-id-badge {
            color: #A3B3FF;
            background: rgba(78, 101, 255, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }

        .app-id-input-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .app-id-input {
            flex: 1;
            padding: 6px 10px;
            border-radius: 8px;
            background: #0B0E14;
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
        }

        .app-id-save-btn {
            padding: 6px 12px;
            border-radius: 8px;
            background: var(--orange-primary);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="brand-logo">&#9670;</div>
        <h1 class="card-title">World ID Verification</h1>
        <p class="card-subtitle">Zero-Knowledge Proof of Human for P2P Escrow</p>

        <button class="action-button btn-primary" id="btnVerifyWorldId" onclick="triggerWorldIdVerify()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span id="btnVerifyText">Verify with World App</span>
        </button>

        <div class="status-box" id="statusBox"></div>

        <div class="app-id-bar">
            <div class="app-id-label">
                <span>World App ID</span>
                <span class="app-id-badge" id="appIdBadge">app_staging_p2pfather_dev</span>
            </div>
            <div style="color: #6B7280; font-size: 10px; line-height: 1.4; margin-bottom: 6px;">
                Using a registered app from <a href="https://developer.worldcoin.org" target="_blank" style="color: var(--orange-primary); text-decoration: underline;">developer.worldcoin.org</a>?
            </div>
            <div class="app-id-input-row">
                <input type="text" id="customAppIdInput" placeholder="app_... (from developer.worldcoin.org)" class="app-id-input" />
                <button onclick="saveAppId()" class="app-id-save-btn">Save</button>
            </div>
        </div>
    </div>

    <script>
        let worldConfig = { app_id: 'app_staging_p2pfather_dev', action: 'p2pfather-trader-verification' };
        let activeUserId = new URLSearchParams(window.location.search).get('userId') || 'guest_trader_' + Math.floor(Math.random() * 10000);
        let pollInterval = null;

        async function initConfig() {
            try {
                const storedAppId = localStorage.getItem('p2pfather_world_app_id');
                if (storedAppId) {
                    worldConfig.app_id = storedAppId;
                    const inputEl = document.getElementById('customAppIdInput');
                    if (inputEl) inputEl.value = storedAppId;
                } else {
                    const res = await fetch('/api/world/config');
                    if (res.ok) {
                        const data = await res.json();
                        worldConfig = data;
                    }
                }
            } catch (e) {
                console.warn("Config load error:", e);
            }
            const badgeEl = document.getElementById('appIdBadge');
            if (badgeEl) badgeEl.textContent = worldConfig.app_id;
        }

        function saveAppId() {
            const val = document.getElementById('customAppIdInput').value.trim();
            if (!val) return;
            worldConfig.app_id = val;
            localStorage.setItem('p2pfather_world_app_id', val);
            const badgeEl = document.getElementById('appIdBadge');
            if (badgeEl) badgeEl.textContent = val;
            const statusBox = document.getElementById('statusBox');
            statusBox.style.display = 'block';
            statusBox.className = 'status-box info';
            statusBox.textContent = 'App ID set to: ' + val + '. Tap "Verify with World App" now!';
        }

        async function triggerWorldIdVerify() {
            const statusBox = document.getElementById('statusBox');
            const btn = document.getElementById('btnVerifyWorldId');
            const btnText = document.getElementById('btnVerifyText');

            statusBox.style.display = 'block';
            statusBox.className = 'status-box info';
            statusBox.textContent = 'Connecting to Worldcoin bridge...';
            btn.disabled = true;
            btnText.textContent = 'Opening World App...';

            try {
                const res = await fetch('/api/world/initiate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: activeUserId,
                        appId: worldConfig.app_id,
                        action: worldConfig.action
                    })
                });

                const data = await res.json();
                if (!data.success || !data.connectorURI) {
                    throw new Error(data.error || 'Failed to initialize session');
                }

                statusBox.innerHTML = `
                    <div><strong>📱 Opening World App...</strong></div>
                    <div style="margin-top: 4px; font-size: 11px;">If World App didn't open automatically, <a href="${data.connectorURI}" style="color: #A3B3FF; text-decoration: underline; font-weight: 700;">tap here to open</a>.</div>
                `;

                // Redirect immediately to World App
                window.location.href = data.connectorURI;

                // Start polling in background
                const requestId = data.requestId;
                let attempts = 0;
                if (pollInterval) clearInterval(pollInterval);

                pollInterval = setInterval(async () => {
                    attempts++;
                    if (attempts > 90) {
                        clearInterval(pollInterval);
                        btn.disabled = false;
                        btnText.textContent = 'Verify with World App';
                        return;
                    }

                    try {
                        const pollRes = await fetch(`/api/world/poll/${requestId}`);
                        const pollData = await pollRes.json();

                        if (pollData.status === 'completed' && pollData.verified) {
                            clearInterval(pollInterval);
                            btn.disabled = false;
                            btn.style.background = '#10B981';
                            btnText.textContent = '✓ Verified Human Trader';
                            statusBox.className = 'status-box success';
                            statusBox.innerHTML = `&#10004; <strong>World ID Verification Approved!</strong><br>Nullifier: <code>${(pollData.nullifier_hash || '').slice(0, 16)}...</code><br>Badge: <strong>[🌐 World ID Verified Human]</strong> awarded. You can now close this tab and return to Telegram.`;
                        } else if (pollData.status === 'failed') {
                            clearInterval(pollInterval);
                            btn.disabled = false;
                            btnText.textContent = 'Verify with World App';
                            statusBox.className = 'status-box error';
                            statusBox.innerHTML = `&#10008; Verification failed: ${pollData.error || 'Verification declined'}.<br><small>If World App shows Failed, ensure your App ID is registered at <a href="https://developer.worldcoin.org" target="_blank" style="color:#FE7446;">developer.worldcoin.org</a>.</small>`;
                        }
                    } catch (e) {
                        // keep polling
                    }
                }, 2000);

            } catch (err) {
                btn.disabled = false;
                btnText.textContent = 'Verify with World App';
                statusBox.className = 'status-box error';
                statusBox.textContent = 'Error: ' + (err.message || err);
            }
        }

        window.onload = initConfig;
    </script>
</body>
</html>
