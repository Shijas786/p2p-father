<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean Single Cyber WhatsApp Icon with Subtle Float -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0" dur="3.5s" repeatCount="indefinite" />

    <!-- Outer Pulsing Neon Ambient Glow -->
    <circle cx="32" cy="32" r="22" fill="#25D366" opacity="0.08">
      <animate attributeName="opacity" values="0.08; 0.25; 0.08" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="r" values="20; 24; 20" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Main WhatsApp Speech Bubble Body -->
    <path 
      d="M32 10 C19.85 10 10 19.85 10 32 C10 36.3 11.23 40.32 13.37 43.74 L10.5 54 L21.03 51.24 C24.3 53.01 28.03 54 32 54 C44.15 54 54 44.15 54 32 C54 19.85 44.15 10 32 10 Z" 
      fill="#052418" 
      stroke="#25D366" 
      stroke-width="2.5" 
      stroke-linejoin="round"
    />

    <!-- Inner Dashed Cyber Accent Line -->
    <path 
      d="M32 14 C22.06 14 14 22.06 14 32 C14 35.5 15.02 38.76 16.78 41.52 L14.4 49.6 L22.72 47.41 C25.38 48.84 28.58 49.6 32 49.6 C41.94 49.6 50 41.94 50 32 C50 22.06 41.94 14 32 14 Z" 
      fill="none" 
      stroke="#00e5a0" 
      stroke-width="1.2" 
      stroke-dasharray="3 2" 
      opacity="0.8"
    />

    <!-- Single WhatsApp Phone Receiver -->
    <path 
      d="M26.5 22 C25.8 22 25.1 22.3 24.6 22.9 L23.1 24.7 C22.6 25.3 22.4 26.2 22.7 27 C24.2 30.9 26.8 34.3 30.2 36.8 C31.7 37.9 33.4 38.8 35.2 39.4 C36 39.7 36.9 39.4 37.4 38.8 L38.9 37 C39.5 36.3 39.4 35.3 38.7 34.7 L35.5 32.2 C34.9 31.7 34 31.8 33.5 32.4 L32.6 33.5 C30.3 32.2 28.5 30.4 27.2 28.1 L28.4 27.2 C29 26.7 29.1 25.8 28.6 25.2 L26.1 22.5 C25.8 22.2 25.3 22 24.8 22 Z" 
      fill="#25D366"
    />

    <!-- Glowing Cyber Node Dot -->
    <circle cx="43" cy="21" r="3" fill="#00e5a0">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
