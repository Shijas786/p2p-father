  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      // Ignore generic cross-origin "Script error." with no line details
      if (typeof msg === 'string' && (msg.includes('Script error') || (lineNo === 0 && columnNo === 0))) {
        console.warn('Ignored cross-origin script error:', msg);
        return true; // Suppress error
      }
      console.error('JS Error:', msg, url, lineNo, columnNo, error);
      return true; // Prevent default error popup in production
    };
    window.onunhandledrejection = function (event) {
      console.warn('Unhandled promise rejection:', event.reason);
    };
  </script>
